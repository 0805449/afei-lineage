<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>阿肥天堂 B0.7</title>
</head>
<body style="margin:0;background:#0e0b0c;color:#eadbd5;font-family:'Microsoft JhengHei',sans-serif;display:grid;place-items:center;height:100vh">
<div id="loading">B0.7 遊戲載入中…</div>
<script>
(async()=>{
  try{
    const r=await fetch('.deploy/b07-part00.txt?v=B0.7');
    if(!r.ok) throw new Error('資料檔讀取失敗：'+r.status);
    const s=(await r.text()).trim();
    const bin=Uint8Array.from(atob(s),c=>c.charCodeAt(0));
    if(typeof DecompressionStream==='undefined') throw new Error('此瀏覽器不支援遊戲解壓縮，請使用新版 Chrome / Edge / Safari');
    const ds=new DecompressionStream('gzip');
    const html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('loading').textContent='B0.7 載入失敗：'+e.message;
    console.error(e);
  }
})();
</script>
</body>
</html>
