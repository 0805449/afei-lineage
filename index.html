// ===== Alpha 5 overrides: 秋月技術對照 + 自包含原創素材 =====
// 技術原則：
// 1) 音訊依秋月版的「場景 BGM + SFX 多副檔名 + 節流/播放池」概念重寫。
// 2) 不內嵌/轉載秋月或阿肥未明確授權的原始音樂、音效、背景圖。
// 3) 若專案目錄中存在使用者有權使用的 assets/ 檔案，優先採用；否則使用本檔內建的原創 SVG 場景與 WebAudio 合成音訊。

const A5_AUDIO_PREF_KEY='afei_b1_audio_pref_v2';
let a5Pref={bgm:true,sfx:true,bgmVol:36,sfxVol:50};
try{
  const old=JSON.parse(localStorage.getItem(AUDIO_PREF_KEY)||'{}')||{};
  const now=JSON.parse(localStorage.getItem(A5_AUDIO_PREF_KEY)||'{}')||{};
  a5Pref={...a5Pref,...old,...now};
}catch(e){}
audioPref.bgm=a5Pref.bgm!==false;
audioPref.sfx=a5Pref.sfx!==false;

function a5SavePref(){
  a5Pref.bgm=audioPref.bgm!==false;
  a5Pref.sfx=audioPref.sfx!==false;
  try{localStorage.setItem(A5_AUDIO_PREF_KEY,JSON.stringify(a5Pref))}catch(e){}
  try{localStorage.setItem(AUDIO_PREF_KEY,JSON.stringify({bgm:a5Pref.bgm,sfx:a5Pref.sfx}))}catch(e){}
}
saveAudioPref=a5SavePref;

let a5Ctx=null,a5Master=null,a5BgmGain=null,a5SfxGain=null,a5BgmTimer=null,a5BgmStep=0,a5BgmSynthScene='';
let a5FileBgm=null,a5FileBgmKey='',a5BgmProbeToken=0;
const a5MediaChoice=new Map(),a5MediaMiss=new Set(),a5Throttle=new Map();

function a5CtxEnsure(){
  if(!a4AudioUnlocked)return null;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return null;
  if(!a5Ctx){
    a5Ctx=new AC();
    a5Master=a5Ctx.createGain();
    a5BgmGain=a5Ctx.createGain();
    a5SfxGain=a5Ctx.createGain();
    a5BgmGain.gain.value=(Number(a5Pref.bgmVol)||0)/100;
    a5SfxGain.gain.value=(Number(a5Pref.sfxVol)||0)/100;
    a5BgmGain.connect(a5Master);a5SfxGain.connect(a5Master);a5Master.connect(a5Ctx.destination);
  }
  if(a5Ctx.state==='suspended')a5Ctx.resume().catch(()=>{});
  return a5Ctx;
}
const _a4Unlock=unlockAudio;
unlockAudio=function(){
  _a4Unlock();
  a4AudioUnlocked=true;
  a5CtxEnsure();
};

function a5Noise(dur=.08,vol=.15,filter=1200){
  const c=a5CtxEnsure(); if(!c||!audioPref.sfx)return;
  const len=Math.max(1,Math.floor(c.sampleRate*dur)),buf=c.createBuffer(1,len,c.sampleRate),data=buf.getChannelData(0);
  for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*(1-i/len);
  const src=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
  src.buffer=buf;f.type='bandpass';f.frequency.value=filter;f.Q.value=.75;
  g.gain.setValueAtTime(vol,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);
  src.connect(f);f.connect(g);g.connect(a5SfxGain);src.start();
}
function a5Tone(freq=440,dur=.12,vol=.12,type='sine',endFreq=null,delay=0){
  const c=a5CtxEnsure(); if(!c||!audioPref.sfx)return;
  const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+delay;
  o.type=type;o.frequency.setValueAtTime(freq,t);

function a5TrySfx(stem,vol,fallbackKind,throttle=65){

    }

    const list=a5FileCandidates(stem);let i=0;
    const next=()=>{
      if(i>=list.length){a5MediaMiss.add('sfx:'+stem);a5SynthSfx(fallbackKind);updateAssetStatus();return}
      const p=list[i++],a=new Audio();a.preload='auto';a.volume=Math.min(1,vol*(Number(a5Pref.sfxVol)||50)/50);

function a5BgmNote(scene){
  const c=a5CtxEnsure();if(!c||!audioPref.bgm)return;
  const p=A5_BGM_PATTERNS[scene]||A5_BGM_PATTERNS.battle;
  const semi=p.notes[a5BgmStep++%p.notes.length],freq=p.root*Math.pow(2,semi/12);
  const t=c.currentTime,o=c.createOscillator(),g=c.createGain(),lp=c.createBiquadFilter();
  o.type=(scene==='boss'||scene==='battle')?'triangle':'sine';o.frequency.value=freq;
  lp.type='lowpass';lp.frequency.value=scene==='battle'?900:scene==='boss'?650:1200;
  g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(scene==='boss'?.045:.032,t+.03);
  g.gain.exponentialRampToValueAtTime(.001,t+(p.tempo/1000)*1.55);
  o.connect(lp);lp.connect(g);g.connect(a5BgmGain);o.start(t);o.stop(t+(p.tempo/1000)*1.65);
  if(a5BgmStep%2===0){
    const b=c.createOscillator(),bg=c.createGain();b.type='sine';b.frequency.value=p.root/2;
    bg.gain.setValueAtTime(.001,t);bg.gain.exponentialRampToValueAtTime(scene==='boss'?.03:.018,t+.02);
    bg.gain.exponentialRampToValueAtTime(.001,t+(p.tempo/1000)*1.8);b.connect(bg);bg.connect(a5BgmGain);b.start(t);b.stop(t+(p.tempo/1000)*1.9);
  }
}

function a6AreaName(id){
  if(A6_AREA_ALIAS[id])return A6_AREA_ALIAS[id];

    const n=Number(id.match(/\d+/)[0]);

    const lo=Math.floor((n-1)/10)*10+1,hi=lo+9;

}
function a6GeneralFallback(kind){

  if(kind==='snow')return ['歐瑞雪原','歐瑞雪壁'];
  if(kind==='dungeon')return ['地監','地監深層'];
  if(kind==='tower')return ['傲慢之塔'];
  if(kind==='boss')return ['決鬥競技場','地監深層'];

updateSceneBackground=function(){
  if(!state)return;
  const battle=$('#battle'),bg=$('#scene-bg');if(!battle||!bg)return;
  const kind=sceneKind(state.mapId),title=mapTitle(state.mapId),preferred=a6AreaName(state.mapId);
  battle.dataset.scene=kind;a4BgOk=false;
  bg.style.backgroundImage=`url("${a5SceneData(kind,title)}")`;
  const names=[preferred,title,...a6GeneralFallback(kind)].filter(Boolean);
  const candidates=[...new Set(names)].map(n=>A6_AREA_ROOT+encodeURIComponent(n)+'.jpg');
  const token=++a4BgToken;
  const tryAt=i=>{
    if(token!==a4BgToken)return;
    if(i>=candidates.length){battle.dataset.a5Source='builtin';updateAssetStatus();return}
    const im=new Image();
    im.onload=()=>{if(token!==a4BgToken)return;a4BgOk=true;bg.style.backgroundImage=`url("${candidates[i]}")`;battle.dataset.a5Source='local';updateAssetStatus()};
    im.onerror=()=>tryAt(i+1);im.src=candidates[i];
  };
  tryAt(0);updateAssetStatus();
};

playPlayerHurt=function(){

function a7EnsureVillageStage(){
 let st=$('#village-stage');if(st)return st;st=document.createElement('section');st.id='village-stage';st.innerHTML='<div class="village-head"><h2 id="village-title">村莊</h2><small>安全區 · 戰鬥停止</small><button class="village-leave" id="village-leave">離開村莊</button></div><div class="village-body"><div class="village-npcs"><div class="village-section-title">NPC</div><div id="village-npc-grid" class="village-npc-grid"></div></div><div id="village-action" class="village-action"><div class="a7-note">選擇 NPC 查看可使用功能。</div></div></div>';$('#battle').appendChild(st);return st;

function a7ShopList(npc){if(A7_SHOPS[npc.id])return A7_SHOPS[npc.id].filter(id=>DATA.items[id]);if(A7_GENERIC_SHOP_IDS.has(npc.id))return A7_SHOPS.default.filter(id=>DATA.items[id]);return []}
function a7Bundle(id){if(id==='wpn_5')return {cnt:1000,cost:100};if(id==='wpn_22')return {cnt:1000,cost:200};const d=DATA.items[id];return {cnt:1,cost:Math.max(1,Math.floor(Number(d?.p||1)))} }
function a7Buy(id){const d=DATA.items[id],b=a7Bundle(id);if(!d)return;if(state.player.gold<b.cost){toast('金幣不足');return}state.player.gold-=b.cost;state.inventory[id]=(state.inventory[id]||0)+b.cnt;log('向商店購買 '+d.n+' ×'+b.cnt+'，花費 '+fmt(b.cost)+' 金幣','gain');save();renderHUDDynamic();a7OpenNpc(state._a7NpcId)}
function a7WhLoad(){try{const x=JSON.parse(localStorage.getItem(A7_WH_KEY)||'{}');return {gold:Math.max(0,Number(x.gold||0)),items:x.items&&typeof x.items==='object'?x.items:{}}}catch(e){return {gold:0,items:{}}}}

function a7WhGold(dir,amt){amt=Math.max(1,Math.floor(Number(amt)||0));const w=a7WhLoad();if(dir==='in'){if(state.player.gold<amt){toast('金幣不足');return}state.player.gold-=amt;w.gold+=amt}else{if(w.gold<amt){toast('倉庫金幣不足');return}w.gold-=amt;state.player.gold+=amt}a7WhSave(w);save();renderHUDDynamic();a7OpenNpc(state._a7NpcId)}
function a7RenderShop(npc){const list=a7ShopList(npc),box=$('#village-action');if(!list.length){box.innerHTML='<div class="a7-note a7-warn"><b>'+escapeHtml(npc.n)+'</b><br>'+escapeHtml(npc.d||'')+'<br><br>這名 NPC 的可靠商品表尚未接入，本版不偽造庫存。</div>';return}box.innerHTML='<div class="village-section-title">'+escapeHtml(npc.n)+' · '+escapeHtml(npc.title||'商店')+'</div><div class="a7-note">'+escapeHtml(npc.d||'')+'</div>'+list.map(id=>{const d=DATA.items[id],b=a7Bundle(id);return '<div class="a7-shop-row"><div><b>'+escapeHtml(d.n||id)+'</b><small>'+fmt(b.cost)+' 金幣'+(b.cnt>1?' · ×'+b.cnt:'')+'</small></div><button class="a7-btn alt" data-a7-buy="'+escapeHtml(id)+'">購買</button></div>'}).join('');box.querySelectorAll('[data-a7-buy]').forEach(b=>b.onclick=()=>a7Buy(b.dataset.a7Buy))}

function a7RenderTravel(npc){const box=$('#village-action');if(npc.id==='npc_ispa'&&DATA.maps.oblivion_island){const ok=state.player.lv>=45&&state.player.gold>=10000;box.innerHTML='<div class="village-section-title">'+escapeHtml(npc.n)+' · '+escapeHtml(npc.title||'傳送')+'</div><div class="a7-note">'+escapeHtml(npc.d||'')+'<br><br>目前可前往遺忘之島。需求：Lv.45、10,000 金幣。</div><button id="a7-ispa" class="a7-btn alt" '+(ok?'':'disabled')+'>前往遺忘之島</button>';const b=$('#a7-ispa');if(b)b.onclick=()=>{if(!ok)return;state.player.gold-=10000;a7LeaveVillage('oblivion_island')}}else box.innerHTML='<div class="a7-note a7-warn"><b>'+escapeHtml(npc.n)+'</b><br>'+escapeHtml(npc.d||'')+'<br><br>傳送目的地或條件資料尚未完整接入。</div>'}
